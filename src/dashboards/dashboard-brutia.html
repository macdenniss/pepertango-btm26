<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brutia Tango Fest 2026 — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#2C2C2C;}
:root{--accent:#7b2ff7;--accent-mid:#9c47ff;--accent-light:#f3eeff;--accent-border:#e9dff5;}
.header{background:#fff;border-bottom:2px solid var(--accent-border);padding:1.5rem 2rem;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;}
.header-title{display:flex;align-items:center;gap:1rem;}
.header-title h1{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--accent);}
.header-buttons{display:flex;gap:0.5rem;}
.btn{padding:10px 20px;border-radius:6px;border:none;font-weight:600;cursor:pointer;transition:all 0.2s;font-size:0.85rem;text-transform:uppercase;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent-mid);transform:translateY(-2px);}
.btn-secondary{background:var(--accent-light);color:var(--accent);border:2px solid var(--accent);}.btn-secondary:hover{background:var(--accent-border);}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--accent-border);}
.tab{padding:12px 24px;background:transparent;border:none;cursor:pointer;color:var(--accent);font-weight:600;transition:all 0.2s;position:relative;}
.tab:hover{background:var(--accent-light);}.tab.active{color:var(--accent);}.tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--accent);}
.container{padding:2rem;max-width:1400px;margin:0 auto;}
.content{display:none;}.content.active{display:block;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem;margin-bottom:2rem;}
.stat-card{background:#fff;border:2px solid var(--accent-border);border-radius:10px;padding:1.5rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.stat-card h2{font-size:0.85rem;color:#7a7a7a;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;}
.stat-card .value{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;color:var(--accent);}
.table-container{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow-x:auto;}
.table-header{background:var(--accent-light);padding:1rem;display:grid;gap:1rem;border-bottom:2px solid var(--accent-border);font-weight:600;color:var(--accent);grid-template-columns:1fr 1.2fr 1fr 0.8fr 0.8fr 0.8fr 0.6fr;min-width:900px;}
.table-row{padding:1rem;border-bottom:1px solid var(--accent-light);display:grid;gap:1rem;transition:background 0.2s;grid-template-columns:1fr 1.2fr 1fr 0.8fr 0.8fr 0.8fr 0.6fr;min-width:900px;}
.table-row:hover{background:var(--accent-light);}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;text-transform:uppercase;}
.badge-success{background:#d4edda;color:#155724;}.badge-warning{background:#fff3cd;color:#856404;}
.filters{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.filter-input,.filter-select{padding:10px 12px;border:2px solid var(--accent-border);border-radius:6px;font-family:'Inter',sans-serif;font-size:0.9rem;}
.empty{padding:2rem;text-align:center;color:#aaa;}
@media(max-width:900px){.tabs{overflow-x:auto;}.tab{padding:10px 16px;font-size:0.85rem;}.table-header,.table-row{grid-template-columns:1fr 1fr 1fr;}}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">
      <h1>📊 Brutia Tango Fest 2026 — Admin</h1>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary" onclick="reloadData()">🔄 Aggiorna</button>
      <button class="btn btn-primary" onclick="exportCSV()">📥 Esporta CSV</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab(this, 'overview')">📈 Overview</button>
    <button class="tab" onclick="switchTab(this, 'iscritti')">👥 Iscritti</button>
    <button class="tab" onclick="switchTab(this, 'ricavi')">💰 Ricavi</button>
  </div>
</div>

<div class="container">
  <!-- TAB: OVERVIEW -->
  <div class="content active" id="overview">
    <div class="stat-grid">
      <div class="stat-card">
        <h2>Iscrizioni Totali</h2>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <h2>In Attesa</h2>
        <div class="value" id="stat-pending">0</div>
      </div>
      <div class="stat-card">
        <h2>Pagamenti Ricevuti</h2>
        <div class="value" id="stat-paid">€0</div>
      </div>
      <div class="stat-card">
        <h2>Posti Disponibili</h2>
        <div class="value" id="stat-available">80</div>
      </div>
    </div>

    <div style="background:#fff;border-radius:10px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-top:2rem;">
      <h3 style="color:var(--accent);margin-bottom:1rem;font-size:1.2rem;">Ultimi Iscritti</h3>
      <div id="recent-list" class="empty">Nessun dato</div>
    </div>
  </div>

  <!-- TAB: ISCRITTI -->
  <div class="content" id="iscritti">
    <div class="filters">
      <input type="text" class="filter-input" id="search-nome" placeholder="Cerca nome..." onkeyup="filterTable()">
      <select class="filter-select" id="filter-status" onchange="filterTable()">
        <option value="">Tutti gli stati</option>
        <option value="In attesa">In attesa</option>
        <option value="Confermato">Confermato</option>
      </select>
    </div>

    <div class="table-container">
      <div class="table-header">
        <div>Nome</div>
        <div>Email</div>
        <div>Telefono</div>
        <div>Pacchetto</div>
        <div>Totale</div>
        <div>Data Iscr.</div>
        <div>Stato</div>
      </div>
      <div id="iscritti-list" class="empty">Caricamento...</div>
    </div>
  </div>

  <!-- TAB: RICAVI -->
  <div class="content" id="ricavi">
    <div style="background:#fff;border-radius:10px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.05);">
      <h3 style="color:var(--accent);margin-bottom:1.5rem;">Riepilogo Ricavi per Pacchetto</h3>
      <div id="revenue-summary" class="empty">Caricamento...</div>
    </div>
  </div>
</div>

<script>
const APPSSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6pqs5rvySS2_il_VAJLU07ucnIFdZ86RT6OWlhxVzDvb04REbJTt3ZXaziRvmDmTR/exec';
let allData = [];

function loadData() {
  fetch(APPSSCRIPT_URL + '?action=getIscritti&evento=Brutia')
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        allData = data.data || [];
        updateStats();
        renderIscritti();
        renderRecent();
        renderRevenue();
      }
    })
    .catch(err => console.error('Errore:', err));
}

function updateStats() {
  const total = allData.length;
  const pending = allData.filter(r => r.stato === 'In attesa').length;
  const paid = allData.filter(r => r.pagamento === 'Anticipo versato' || r.pagamento === 'Saldato').reduce((sum, r) => sum + (parseFloat(r.totale) || 0), 0);
  const available = Math.max(0, 80 - total);

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-paid').textContent = '€' + paid.toFixed(2);
  document.getElementById('stat-available').textContent = available;
}

function renderIscritti() {
  const container = document.getElementById('iscritti-list');
  if (allData.length === 0) {
    container.innerHTML = '<div class="empty">Nessun iscritto</div>';
    return;
  }

  container.innerHTML = allData.map(r => `
    <div class="table-row">
      <div><strong>${escapeHTML(r.nome)} ${escapeHTML(r.cognome)}</strong></div>
      <div>${escapeHTML(r.email)}</div>
      <div>${escapeHTML(r.telefono)}</div>
      <div>${escapeHTML(r.pacchetto || '-')}</div>
      <div>€${parseFloat(r.totale || 0).toFixed(2)}</div>
      <div style="font-size:0.85rem;">${formatDate(r.data_iscr)}</div>
      <div><span class="badge ${r.stato === 'Confermato' ? 'badge-success' : 'badge-warning'}">${escapeHTML(r.stato || 'N/A')}</span></div>
    </div>
  `).join('');
}

function renderRecent() {
  const recent = allData.slice(-5).reverse();
  if (recent.length === 0) {
    document.getElementById('recent-list').innerHTML = '<div class="empty">Nessun iscritto</div>';
    return;
  }

  document.getElementById('recent-list').innerHTML = recent.map(r => `
    <div style="padding:0.8rem;border-bottom:1px solid var(--accent-light);">
      <div style="font-weight:600;">${escapeHTML(r.nome)} ${escapeHTML(r.cognome)}</div>
      <div style="font-size:0.85rem;color:#666;">${escapeHTML(r.email)} • €${parseFloat(r.totale || 0).toFixed(2)} • ${formatDate(r.data_iscr)}</div>
    </div>
  `).join('');
}

function renderRevenue() {
  const byPackage = {};
  allData.forEach(r => {
    const pkg = r.pacchetto || 'N/A';
    if (!byPackage[pkg]) byPackage[pkg] = { count: 0, total: 0 };
    byPackage[pkg].count++;
    byPackage[pkg].total += parseFloat(r.totale || 0);
  });

  const html = Object.entries(byPackage).map(([pkg, data]) => `
    <div style="display:grid;grid-template-columns:1fr 0.5fr 0.5fr;gap:1rem;padding:1rem;border-bottom:1px solid var(--accent-light);align-items:center;">
      <div><strong>${escapeHTML(pkg)}</strong></div>
      <div style="text-align:right;"><div style="color:#666;font-size:0.85rem;">Quantità</div><div style="font-size:1.3rem;font-weight:600;color:var(--accent);">${data.count}</div></div>
      <div style="text-align:right;"><div style="color:#666;font-size:0.85rem;">Ricavo</div><div style="font-size:1.3rem;font-weight:600;color:var(--accent);">€${data.total.toFixed(2)}</div></div>
    </div>
  `).join('');

  document.getElementById('revenue-summary').innerHTML = html || '<div class="empty">Nessun dato</div>';
}

function filterTable() {
  const nome = document.getElementById('search-nome').value.toLowerCase();
  const status = document.getElementById('filter-status').value;

  const filtered = allData.filter(r => {
    const nomeMatch = (r.nome + ' ' + r.cognome).toLowerCase().includes(nome);
    const statusMatch = !status || r.stato === status;
    return nomeMatch && statusMatch;
  });

  const container = document.getElementById('iscritti-list');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">Nessun risultato</div>';
    return;
  }

  container.innerHTML = filtered.map(r => `
    <div class="table-row">
      <div><strong>${escapeHTML(r.nome)} ${escapeHTML(r.cognome)}</strong></div>
      <div>${escapeHTML(r.email)}</div>
      <div>${escapeHTML(r.telefono)}</div>
      <div>${escapeHTML(r.pacchetto || '-')}</div>
      <div>€${parseFloat(r.totale || 0).toFixed(2)}</div>
      <div style="font-size:0.85rem;">${formatDate(r.data_iscr)}</div>
      <div><span class="badge ${r.stato === 'Confermato' ? 'badge-success' : 'badge-warning'}">${escapeHTML(r.stato || 'N/A')}</span></div>
    </div>
  `).join('');
}

function switchTab(btn, tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabName).classList.add('active');
}

function reloadData() {
  loadData();
}

function exportCSV() {
  if (allData.length === 0) {
    alert('Nessun dato da esportare');
    return;
  }

  let csv = 'Nome,Cognome,Email,Telefono,Pacchetto,Totale,Data Iscrizione,Stato\n';
  allData.forEach(r => {
    csv += `"${r.nome}","${r.cognome}","${r.email}","${r.telefono}","${r.pacchetto || ''}","${r.totale}","${formatDate(r.data_iscr)}","${r.stato}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'brutia-iscritti-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  window.URL.revokeObjectURL(url);
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const date = new Date(dateStr);
  return date.toLocaleDateString('it-IT', { year: '2-digit', month: '2-digit', day: '2-digit' });
}

window.addEventListener('load', loadData);
setInterval(loadData, 30000);
</script>

</body>
</html>
